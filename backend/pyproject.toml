[project]
name = "quote-compare-backend"
version = "0.1.0"
description = "采购报价对比Agent 后端：报价解析流水线、机械对比、主数据服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "jsonschema>=4.26.0",
    "python-multipart>=0.0.32",
    "openai>=3.10.0",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
